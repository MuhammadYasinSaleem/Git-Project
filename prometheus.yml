global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape your Express API metrics
  - job_name: 'express-auth-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:5000']

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
